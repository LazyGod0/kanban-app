services:
  db:
    image: postgres:16-alpine
    env_file:
      - ./.env.production
    volumes:
      - kanban-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./kanban-backend
      dockerfile: Dockerfile
    env_file:
      - ./.env.production
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./kanban-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  kanban-db:
