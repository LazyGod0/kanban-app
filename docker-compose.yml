services:
  db:
    image: postgres:16
    env_file:
      - ./kanban-backend/.env
    ports:
      - "5432:5432"
    volumes:
      - kanban-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./kanban-backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: uvicorn app.app:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./kanban-backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./kanban-backend:/app 
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./kanban-frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: yarn dev --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./kanban-frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  kanban-db:
  frontend-node-modules: